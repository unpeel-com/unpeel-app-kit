[package]
name = "unpeel-app-kit"
version = "0.1.0"
edition = "2024"
description = "Opinionated Ratatui components for standalone and Unpeel-hosted terminal Apps"
license = "MIT"

[features]
default = ["ui-bridge"]
markdown-text-area = ["dep:tui-textarea", "dep:unicode-segmentation"]
ui-bridge = ["dep:hmac", "dep:libc", "dep:sha2"]

[dependencies]
base64 = "0.22"
hmac = { version = "0.12", optional = true }
libc = { version = "0.2", optional = true }
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tui-textarea = { package = "tui-textarea-2", version = "0.12", default-features = false, features = ["ratatui"], optional = true }
unicode-segmentation = { version = "1", optional = true }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
